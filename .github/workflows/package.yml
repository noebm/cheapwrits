name: Package addon

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: cachix/install-nix-action@v31.11.5
      - name: Build addon package
        run: nix build .#writ-maxxer
      - name: Upload addon ZIP
        uses: actions/upload-artifact@v7.0.2
        with:
          name: WritMaxxer-${{ github.sha }}
          path: result/share/wow-addons/
          if-no-files-found: error
