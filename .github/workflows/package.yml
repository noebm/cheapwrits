name: Package addon

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      ZIP_FILE: CheapWrits-${{ github.event.release.tag_name || github.sha }}.zip
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: cachix/install-nix-action@v31.11.5
      - name: Build addon package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          derivation=$(nix eval --impure --raw .#cheapwrits --apply 'pkg: (pkg.override { releaseTag = builtins.getEnv "RELEASE_TAG"; }).drvPath')
          nix build "$derivation^*"
      - name: Create addon ZIP
        working-directory: result/share/wow-addons
        run: zip -r "$GITHUB_WORKSPACE/$ZIP_FILE" CheapWrits
      - name: Upload addon ZIP
        uses: actions/upload-artifact@v7.0.2
        with:
          path: ${{ env.ZIP_FILE }}
          archive: false
          if-no-files-found: error
      - name: Attach ZIP to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "$ZIP_FILE"
